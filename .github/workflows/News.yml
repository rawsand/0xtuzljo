
name: Fetch Matching TV Channels

on:
  workflow_dispatch:
  schedule:
    - cron: '40 0 * * *'
    - cron: '40 6,12 * * *'

permissions:
  contents: write

jobs:
  fetch-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch matching channels
        env:
          PLAYLIST_URL_1: ${{ secrets.NEWS_YUPPTV }}
          PLAYLIST_URL_2: ${{ secrets.NEWS_SAMSUNGTVPLUS }}
        run: python News.py

      - name: Upload overwritten playlist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news_channels.m3u          
          git commit -m "Update playlist"
          git push
